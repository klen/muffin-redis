[project]
name = "muffin-redis"
version = "4.1.0"
description = "Redis support for Muffin framework."
authors = [{ name = "Kirill Klenov", email = "horneds@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
keywords = ["redis", "muffin", "asgi", "asyncio"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: AsyncIO",
]
dependencies = ["muffin", "redis"]

[project.optional-dependencies]
fake = ["fakeredis"]

[project.urls]
Homepage = "https://github.com/klen/muffin-redis"
Repository = "https://github.com/klen/muffin-redis"

[dependency-groups]
dev = [
  "pytest",
  "pytest-aio[curio, trio]",
  "ruff",
  "pyrefly",
  "pre-commit",
  "tox",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "muffin_redis"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
log_cli = true
addopts = "-lxsv tests.py"
filterwarnings = "ignore::UserWarning:fakeredis.*"

[tool.pyrefly]
project-includes = ["muffin_redis"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311,py312,py313,py314,py315,pypy311

[testenv]
allowlist_externals = uv,pytest
commands =
  uv pip install -e .[fake] --group dev
	pytest
"""

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py", "muffin_redis/**/*.py"]
exclude = [".venv", "docs", "examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A003",
  "ANN",
  "ASYNC109",
  "ARG",
  "COM",
  "D",
  "DJ",
  "EM",
  "FA100",
  "FIX",
  "N",
  "PLC0415",
  "PLR0912",
  "PLR2004",
  "RET",
  "RSE",
  "RUF012",
  "S101",
  "SLF",
  "TD",
  "TRY003",
  "UP",
]

[tool.bumpversion]
current_version = "4.1.0"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
